id: venom
display-name: "&2Venom"
description: "&7Poisons enemies on hit."
rarity: RARE
max-level: 3
enabled: true
weight: 8
category: OFFENSE
icon: SPIDER_EYE
applicable-items:
  - SWORD
  - AXE
conflicts-with:
  - withering

triggers:
  onAttack:
    chance: "20 + level * 10"
    cooldown: "5"
    global-cooldown: "0"
    target: VICTIM
    radius: "8"
    repeat: 1
    repeat-interval: 2
    delay: 0
    cancel-event: false
    conditions:
      all:
        - victim_not_poisoned
        - attacker_health > 5
        - region_allowed
    effects:
      - potion:
          type: POISON
          duration: "60 + level * 20"
          amplifier: "level - 1"
      - damage: "1 + level"
      - stack_add:
          amount: "1"
          duration: "200"
      - particle:
          type: SPELL_MOB
          count: 12
      - sound: ENTITY_SPIDER_HURT
      - command: "say %victim% was poisoned by %attacker%"
  onKill:
    chance: "100"
    target: SELF
    conditions:
      all:
        - combo_at_least: 2
    effects:
      - deposit: "5 + level * 2"
      - message: "&aVenom combo bonus! +$%level% stack=%stack% combo=%combo%"
      - combo_reset: true


